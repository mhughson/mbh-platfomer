name: Package Windows game

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MonoGame 3.7.1
        run: choco install monogame --version=3.7.1 -y --no-progress

      - name: Install .NET Framework 4.5.2 targeting pack
        run: choco install netfx-4.5.2-devpack -y --no-progress

      - name: Restore NuGet packages
        run: nuget restore .\mbh-platformer\mbh-platformer.sln

      - name: Build game
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio MSBuild was not found."
          }
          $msbuild = Get-ChildItem -Path (Join-Path $installationPath "MSBuild") -Filter MSBuild.exe -Recurse |
            Where-Object { $_.FullName -match "\\Bin\\MSBuild\.exe$" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $msbuild) {
            throw "MSBuild.exe was not found in the Visual Studio installation."
          }
          & $msbuild .\mbh-platformer\mbh-platformer.sln /m /p:Configuration=Release "/p:Platform=Any CPU"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $output = ".\mbh-platformer\mbh-platformer\bin\DesktopGL\AnyCPU\Release"
          $package = ".\windows-package"
          if (-not (Test-Path "$output\mbh-platformer.exe")) {
            throw "Build did not produce mbh-platformer.exe."
          }
          New-Item -ItemType Directory -Path "$package\Content" -Force | Out-Null
          Copy-Item "$output\*" $package -Recurse -Force
          Copy-Item ".\mbh-platformer\mbh-platformer\Content\raw" "$package\Content\raw" -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath ".\mbh-platformer-windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: mbh-platformer-windows
          path: .\mbh-platformer-windows.zip
